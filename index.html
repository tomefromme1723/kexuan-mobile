<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KEXUAN MOBILE · 邓可轩的数字名片</title>
<link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
<style>
:root{--red:#E23A52;--red-d:#A91F35;--red-dd:#7E1426;--red-l:#FF7A8D;--cream:#E9D9B4;--ink:#111;--paper:#E4E5E9;--glow:#9FD3FF;--rx:8deg;--ry:-16deg;--gx:30%}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;background:var(--paper);font-family:"Yuanti SC","PingFang SC","Microsoft YaHei",sans-serif;color:var(--ink);overflow:hidden;
  background-image:radial-gradient(circle at 92% 8%, rgba(226,58,82,.9) 0 2px, transparent 2.5px);background-size:16px 16px}
body::before{content:"";position:fixed;inset:0;background:radial-gradient(circle at 85% 0%, transparent 0 18%, var(--paper) 42%);pointer-events:none}
.stage{position:relative;height:100%;display:flex;align-items:center;justify-content:center;padding-bottom:40px}
.masthead{position:fixed;left:28px;top:22px;z-index:5}
.masthead h1{font-family:"Arial Black",Arial,sans-serif;font-size:44px;line-height:.9;color:var(--red);letter-spacing:-1px}
.masthead p{font-size:13px;margin-top:8px;font-weight:700}
.masthead small{display:block;font-family:"Arial Black",Arial,sans-serif;font-size:10px;letter-spacing:1px;margin-top:4px}
.hint{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);display:flex;gap:10px;z-index:5}
.chip{border:1.5px solid var(--ink);background:#fff;border-radius:999px;padding:7px 14px;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit}
.chip:hover{background:var(--cream)}.chip.red{background:var(--red);color:#fff}
.foot{position:fixed;right:22px;bottom:22px;font-size:11px;color:#85878F;z-index:5;text-align:right}
.sticker-note{position:fixed;right:34px;top:40px;width:178px;background:var(--cream);padding:14px 14px 16px;transform:rotate(4deg);box-shadow:0 4px 10px rgba(0,0,0,.15);font-size:13px;line-height:1.5;z-index:4}
.sticker-note::before{content:"";position:absolute;left:50%;top:-10px;width:70px;height:20px;margin-left:-35px;background:repeating-linear-gradient(180deg,rgba(17,17,17,.75) 0 3px,rgba(200,202,208,.75) 3px 6px);transform:rotate(-4deg)}
.sticker-note b{font-family:"Arial Black",Arial,sans-serif;font-size:11px;display:block;margin-bottom:4px}
@media (max-width:760px){.foot,.sticker-note{display:none}.masthead h1{font-size:30px}.masthead{left:16px;top:14px}}

/* ---------- 3D phone ---------- */
.scaler{transform-origin:center center}
.tilt{perspective:1500px}
.phone{position:relative;width:236px;height:580px;perspective:1100px;transform:rotateX(var(--rx)) rotateY(var(--ry));transition:transform .25s ease-out}
.lid{position:absolute;left:0;top:0;width:236px;height:280px;-webkit-transform-style:preserve-3d;transform-style:preserve-3d;transform-origin:50% 100%;transition:transform .85s cubic-bezier(.3,1.35,.5,1);z-index:3}
.phone.closing .lid{transition:transform .42s cubic-bezier(.6,.02,.95,.45)}
.tilt.snap{animation:snap .2s ease-out}
.phone.covered .keys{visibility:hidden}
@keyframes snap{0%{transform:translateY(0)}35%{transform:translateY(4px) scale(.995)}100%{transform:translateY(0)}}
.phone.closed .lid{transform:rotateX(-180deg)}
.slices{position:absolute;inset:0;transform-style:preserve-3d;pointer-events:none}.slice{position:absolute;inset:0;pointer-events:none}
.lid .slice{border-radius:34px 34px 14px 14px;background:linear-gradient(180deg,#b9bcc4,#7d808a)}
.lid .slice.r{background:linear-gradient(180deg,var(--red-d),var(--red-dd))}
.face{position:absolute;inset:0;border-radius:34px 34px 14px 14px;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.front{transform:rotateX(0deg);background:linear-gradient(160deg,#F7F7F9 0%,#CDD0D7 50%,#9EA1AB 100%);box-shadow:inset 0 2px 0 #fff, inset 0 -3px 6px rgba(0,0,0,.25)}
.back{transform:rotateX(180deg);border-radius:14px 14px 34px 34px;cursor:pointer;overflow:hidden;
  background:radial-gradient(120% 70% at 30% 15%, var(--red-l) 0%, var(--red) 45%, var(--red-d) 100%);box-shadow:inset 0 3px 0 rgba(255,255,255,.5), inset 0 -8px 14px rgba(0,0,0,.28)}
.gloss::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;
  background:linear-gradient(115deg,transparent 0 calc(var(--gx) - 18%),rgba(255,255,255,.42) var(--gx),transparent calc(var(--gx) + 14%))}
.speaker{position:absolute;left:50%;top:15px;width:46px;height:5px;margin-left:-23px;border-radius:4px;background:#555;box-shadow:inset 0 1px 2px #000}
.screen{position:absolute;left:18px;top:30px;width:200px;height:212px;border-radius:8px;background:#0E1A2B;border:4px solid #222;overflow:hidden;box-shadow:0 0 0 2px #888, inset 0 0 18px rgba(0,0,0,.6)}
.screen::after{content:"";position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(255,255,255,.04) 0 1px,transparent 1px 3px),linear-gradient(160deg,rgba(255,255,255,.2) 0%,transparent 35%)}
.brand{position:absolute;left:0;right:0;bottom:12px;text-align:center;font-family:"Arial Black",Arial,sans-serif;font-size:11px;letter-spacing:3px;color:#555}
.outer{position:absolute;left:50%;top:66px;width:96px;height:62px;margin-left:-48px;border-radius:9px;background:#0b0b0f;border:3px solid #333;font-family:"VT323",monospace;color:var(--glow);text-align:center;padding-top:6px;box-shadow:0 0 0 2px rgba(255,255,255,.4)}
.outer .t{font-size:26px;line-height:1}.outer .m{font-size:15px;animation:blink 1.2s steps(2) infinite}
@keyframes blink{50%{opacity:0}}
.cam{position:absolute;left:50%;top:22px;width:26px;height:26px;margin-left:-13px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#8bb 0 3px,#123 4px 8px,#000 9px);box-shadow:0 0 0 3px #ddd,0 0 0 5px #999}
.logo{position:absolute;left:0;right:0;bottom:70px;text-align:center;font-family:"Arial Black",Arial,sans-serif;color:rgba(255,255,255,.9);font-size:20px;letter-spacing:2px;text-shadow:0 1px 0 rgba(0,0,0,.25)}
.tagline{position:absolute;left:0;right:0;bottom:54px;text-align:center;color:rgba(255,255,255,.85);font-size:10px}
.tap{position:absolute;left:0;right:0;bottom:16px;text-align:center;color:#fff;font-size:12px;font-weight:700;animation:bob 1.4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-4px)}}
.stk{position:absolute}
.stk.y2k{background:var(--cream);color:var(--ink);padding:3px 8px;border-radius:999px;border:1.5px solid var(--ink);font-family:"Arial Black",Arial,sans-serif;font-size:10px;transform:rotate(-8deg);box-shadow:0 2px 0 rgba(0,0,0,.25)}
.stk.star{width:42px;height:42px;background:linear-gradient(135deg,#fff,#dfe3ea);clip-path:polygon(50% 0,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%);transform:rotate(14deg);filter:drop-shadow(0 2px 0 rgba(0,0,0,.25))}
/* rhinestones */
.gem{position:absolute;border-radius:50%;pointer-events:none;
  background:radial-gradient(circle at 32% 28%,#fff 0 16%,var(--c) 46%,var(--cd) 100%);
  box-shadow:0 1px 1.5px rgba(0,0,0,.45), inset 0 0 0 .5px rgba(255,255,255,.7)}
.gem.ab{background:radial-gradient(circle at 32% 28%,#fff 0 16%,transparent 30%),conic-gradient(from 20deg,#ffd6f0,#c8f2ff,#fff6c2,#e0c8ff,#ffd6f0)}
.gem.tw::after{content:"";position:absolute;left:50%;top:50%;width:260%;height:260%;margin:-130% 0 0 -130%;
  background:radial-gradient(circle,#fff 0 6%,transparent 8%),linear-gradient(90deg,transparent 46%,#fff 50%,transparent 54%),linear-gradient(0deg,transparent 46%,#fff 50%,transparent 54%);
  -webkit-mask:radial-gradient(circle,#000 0 30%,transparent 62%);mask:radial-gradient(circle,#000 0 30%,transparent 62%);animation:twinkle 2.4s ease-in-out infinite;animation-delay:var(--d,0s);opacity:0}
@keyframes twinkle{0%,70%,100%{opacity:0;transform:scale(.4) rotate(0)}82%{opacity:1;transform:scale(1) rotate(45deg)}}

.hinge{position:absolute;left:22px;top:268px;width:192px;height:26px;border-radius:13px;z-index:2;
  background:linear-gradient(180deg,#fafafa 0%,#bfc2c9 40%,#7d808a 75%,#a8abb3 100%);box-shadow:0 3px 5px rgba(0,0,0,.35)}
.base{position:absolute;left:0;top:282px;width:236px;height:290px;z-index:1}
.base .slice{border-radius:14px 14px 38px 38px;background:linear-gradient(180deg,var(--red-d),var(--red-dd))}
.bface{position:absolute;inset:0;border-radius:14px 14px 38px 38px;
  background:radial-gradient(120% 80% at 30% 0%, var(--red-l) 0%, var(--red) 40%, var(--red-d) 100%);
  box-shadow:inset 0 3px 0 rgba(255,255,255,.4), inset 0 -8px 14px rgba(0,0,0,.28)}
.tilt{position:relative}.shadow{position:absolute;left:24px;width:200px;top:556px;height:34px;border-radius:50%;background:rgba(0,0,0,.25);filter:blur(12px);pointer-events:none}

.keys{position:absolute;left:16px;right:16px;top:22px}
.row{display:flex;justify-content:space-between;align-items:center}
button.k{font-family:inherit;border:none;cursor:pointer;color:var(--ink);background:linear-gradient(180deg,#fff 0%,#E9D9B4 100%);box-shadow:0 3px 0 #8a7a55, 0 4px 3px rgba(0,0,0,.25), inset 0 1px 0 #fff;border-radius:12px;transition:transform .05s}
button.k:active{transform:translateY(3px);box-shadow:0 0 0 #8a7a55, inset 0 1px 0 #fff}
.soft{width:52px;height:22px;font-size:11px;font-weight:700}
.dpad{position:relative;width:84px;height:84px;border-radius:50%;background:linear-gradient(180deg,#f8f8fa,#b5b8c0);box-shadow:0 4px 0 #6f727b, 0 6px 6px rgba(0,0,0,.3), inset 0 2px 0 #fff}
.dpad button{position:absolute;background:transparent;border:none;cursor:pointer;color:#555;font-size:12px;width:28px;height:28px}
.dpad .u{left:28px;top:0}.dpad .d{left:28px;bottom:0}.dpad .l{left:0;top:28px}.dpad .r{right:0;top:28px}
.dpad .ok{left:24px;top:24px;width:36px;height:36px;border-radius:50%;background:radial-gradient(circle at 40% 30%,#fff,#d4d6dc);box-shadow:0 2px 0 #888;color:var(--red);font-family:"Arial Black",Arial,sans-serif;font-size:10px}
.call,.end{width:40px;height:26px;font-size:14px;font-weight:700}.call{color:#1a7f3a}.end{color:var(--red)}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px 10px;margin-top:12px}
.pad .k{height:30px;font-size:15px;font-weight:700;line-height:1;display:flex;flex-direction:column;align-items:center;justify-content:center;border-radius:14px}
.pad .k small{font-size:7px;letter-spacing:1px;color:#6a5a3a;font-weight:700;margin-top:1px}

/* charm */
.charm{position:absolute;right:-6px;top:548px;transform-origin:50% 0;animation:sway 2.6s ease-in-out infinite;z-index:4}
.charm.swing{animation:swing 1.6s ease-out 1, sway 2.6s ease-in-out 1.6s infinite}
@keyframes sway{0%,100%{transform:translateZ(8px) rotate(-7deg)}50%{transform:translateZ(8px) rotate(7deg)}}
@keyframes swing{0%{transform:translateZ(8px) rotate(-38deg)}25%{transform:translateZ(8px) rotate(28deg)}50%{transform:translateZ(8px) rotate(-16deg)}75%{transform:translateZ(8px) rotate(8deg)}100%{transform:translateZ(8px) rotate(-7deg)}}
.charm .string{width:2px;height:40px;margin-left:16px;background:#111}
.charm .bead{width:12px;height:12px;border-radius:50%;margin:-2px 0 0 11px;background:radial-gradient(circle at 32% 28%,#fff 0 18%,var(--c) 50%,var(--cd));box-shadow:0 1px 2px rgba(0,0,0,.4)}
.charm .pic{width:38px;height:48px;background:#111;padding:3px 3px 9px;margin:2px 0 0 0;transform:rotate(6deg);box-shadow:0 3px 5px rgba(0,0,0,.35)}
.charm .pic img{width:100%;height:100%;object-fit:cover;display:block}
.charm .starc{width:28px;height:28px;margin:-4px 0 0 6px;background:linear-gradient(135deg,#fff,var(--cream));clip-path:polygon(50% 0,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%)}

/* ---------- LCD UI ---------- */
.ui{position:absolute;inset:0;color:#EAF4FF;font-size:12px;display:flex;flex-direction:column}
.status{height:16px;display:flex;justify-content:space-between;align-items:center;padding:0 5px;font-family:"VT323",monospace;font-size:15px;background:linear-gradient(180deg,#2a5d8f,#163a5e);color:#fff}
.sig i{display:inline-block;width:3px;background:#fff;margin-right:1px;vertical-align:bottom}
.bat{display:inline-block;width:18px;height:8px;border:1px solid #fff;position:relative;vertical-align:middle}
.bat::after{content:"";position:absolute;left:1px;top:1px;bottom:1px;width:11px;background:#7CFC9B}
.body{flex:1;position:relative;overflow:hidden}
.softbar{height:18px;display:flex;justify-content:space-between;align-items:center;padding:0 6px;font-size:11px;font-weight:700;background:linear-gradient(180deg,#163a5e,#0b2036)}
.softbar a{color:#FFD6E0;text-decoration:none}
.title{padding:4px 6px;font-size:12px;font-weight:700;background:rgba(226,58,82,.9)}
canvas.wall{position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated}
.clock{position:absolute;left:0;right:0;top:10px;text-align:center;font-family:"VT323",monospace;font-size:42px;color:#fff;text-shadow:2px 2px 0 rgba(0,0,0,.6)}
.date{position:absolute;left:0;right:0;top:52px;text-align:center;font-family:"VT323",monospace;font-size:16px;color:#fff;text-shadow:1px 1px 0 #000}
.newmsg{position:absolute;left:10px;right:10px;bottom:10px;background:rgba(11,32,54,.85);border:1px solid var(--glow);padding:5px 6px;font-size:11px;animation:blink 1.4s steps(2) infinite}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;padding:8px}
.cell{height:62px;border-radius:6px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;cursor:pointer;border:1px solid transparent}
.cell .ic{font-size:22px;line-height:1}.cell span{font-size:11px}
.cell.sel{background:linear-gradient(180deg,#FF6A7E,#B5243A);border-color:#fff}
.list{padding:4px 0}
.li{padding:2px 8px;line-height:1.25;font-size:10.5px;border-bottom:1px dashed rgba(159,211,255,.3);cursor:pointer}
.li.sel{background:linear-gradient(90deg,#E23A52,transparent)}
.li small{display:block;font-size:9.5px;color:#9FD3FF}
.li.sel small{color:#fff}
.detail{position:absolute;left:6px;right:6px;bottom:5px;padding:4px 5px;border:1px solid var(--glow);background:rgba(11,32,54,.95);font-size:10.5px;line-height:1.35}
.pad-in{padding:6px 9px;line-height:1.5}
.big{font-size:20px;font-weight:700}
.en{font-family:"VT323",monospace;font-size:18px;color:var(--glow);letter-spacing:1px}
.tag{display:inline-block;background:var(--cream);color:#111;border-radius:3px;padding:0 4px;font-size:11px;font-weight:700;margin:2px 2px 0 0}
.album{position:absolute;inset:0;bottom:22px;display:flex;align-items:center;justify-content:center}
.album canvas{height:100px;image-rendering:pixelated;border:3px solid #fff;box-shadow:3px 3px 0 #E23A52}
.cap{position:absolute;left:0;right:0;bottom:4px;text-align:center;font-family:"VT323",monospace;font-size:16px}
.bubble{background:#EAF4FF;color:#111;border-radius:8px 8px 8px 2px;padding:6px 8px;font-size:12px;line-height:1.5;margin:6px 8px;min-height:20px;white-space:pre-line}
.qr{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}
.qr img{width:104px;height:104px;background:#fff;padding:4px;border-radius:6px}
.qr img.round{border-radius:50%;padding:0}
.qr .id{font-size:10.5px;text-align:center;line-height:1.35}
.boot{position:absolute;inset:0;background:#000;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px}
.boot .bl{font-family:"Arial Black",Arial,sans-serif;color:var(--red);font-size:24px;letter-spacing:1px;animation:pop .9s ease-out}
.boot .bs{font-family:"VT323",monospace;color:#fff;font-size:15px}
@keyframes pop{0%{transform:scale(.3);opacity:0}70%{transform:scale(1.15)}100%{transform:scale(1);opacity:1}}
</style>
</head>
<body>
<div class="masthead"><h1>KEXUAN<br>MOBILE</h1><p>邓可轩的数字名片</p><small>VOL.01 · 2026 · EDITION 2006</small></div>
<div class="sticker-note"><b>HOW TO USE</b>点一下手机翻开。<br>方向键 + OK 浏览，“返回”回上一层。<br>拖动鼠标可以转动手机。<br>在“关注我”里扫码找到我。</div>

<div class="stage">
 <div class="scaler" id="scaler"><div class="tilt" id="tilt">
  <div class="shadow"></div>
  <div class="phone closed covered" id="phone">
    <div class="lid" id="lid">
      
      <div class="face front gloss">
        <div class="speaker"></div>
        <div class="screen" id="screen" aria-live="polite"></div>
        <div class="brand">KEXUAN</div>
      </div>
      <div class="face back gloss" id="backFace" role="button" tabindex="0" aria-label="翻开手机">
        <div class="cam"></div>
        <div class="outer"><div class="t" id="otime">02:00</div><div class="m">✉ 1 NEW</div></div>
        <svg class="stk" style="left:14px;top:14px;width:52px;height:36px;transform:rotate(-14deg);filter:drop-shadow(0 2px 0 rgba(0,0,0,.25))" viewBox="0 0 52 36" aria-hidden="true">
          <path d="M26 18 C14 2 2 6 4 18 C2 30 14 34 26 18 Z" fill="#FFD1DC" stroke="#111" stroke-width="1.5"/>
          <path d="M26 18 C38 2 50 6 48 18 C50 30 38 34 26 18 Z" fill="#FFD1DC" stroke="#111" stroke-width="1.5"/>
          <path d="M22 18 L16 34 L22 31 L26 20 Z M30 18 L36 34 L30 31 L26 20 Z" fill="#FFB3C6" stroke="#111" stroke-width="1.2"/>
          <circle cx="26" cy="18" r="5" fill="#E23A52" stroke="#111" stroke-width="1.5"/>
        </svg>
        <div class="stk star" style="right:14px;top:150px"></div>
        <div class="stk y2k" style="left:16px;bottom:22px">Y2K</div>
        <div class="logo">KEXUAN</div>
        <div class="tagline">imagination, made real.</div>
        <div class="tap">点我翻开 ▲</div>
      </div>
    </div>
    <div class="hinge gloss"></div>
    <div class="base">
      
      <div class="bface gloss" id="bface">
        <div class="keys">
          <div class="row">
            <button class="k soft" data-key="lsoft" aria-label="左软键">选择</button>
            <div class="dpad">
              <button class="u" data-key="up" aria-label="上">▲</button><button class="l" data-key="left" aria-label="左">◀</button>
              <button class="r" data-key="right" aria-label="右">▶</button><button class="d" data-key="down" aria-label="下">▼</button>
              <button class="ok" data-key="ok" aria-label="确定">OK</button>
            </div>
            <button class="k soft" data-key="rsoft" aria-label="右软键">返回</button>
          </div>
          <div class="row" style="padding:6px 14px 0"><button class="k call" data-key="ok" aria-label="接听键">✆</button><button class="k end" data-key="end" aria-label="挂断键">✕</button></div>
          <div class="pad" id="pad"></div>
        </div>
      </div>
    </div>
    <div class="charm" id="charm">
      <div class="string"></div>
      <div class="bead" style="--c:#E23A52;--cd:#7E1426"></div><div class="bead" style="--c:#F3E6C4;--cd:#B9A777"></div><div class="bead" style="--c:#BFE4FF;--cd:#5C8DB5"></div>
      <div class="pic"><img id="charmPic" alt="大头贴挂件"></div>
      <div class="starc"></div>
    </div>
  </div>
 </div></div>
</div>
<div class="hint"><button class="chip red" id="toggle">翻开手机</button><button class="chip" id="mute">声音：开</button></div>

const GEMC = { clear: ['#F4F7FF', '#9AA7BD'], pink: ['#FFB3C6', '#C2456A'], red: ['#FF5A70', '#8E1328'], blue: ['#BFE4FF', '#4B7FB0'] };
function gem(parent, x, y, r, kind, tw){ const g = document.createElement('div'); g.className = 'gem' + (kind === 'ab' ? ' ab' : '') + (tw ? ' tw' : ''); const c = GEMC[kind] || GEMC.clear;
  g.style.cssText = `left:${x - r}px;top:${y - r}px;width:${r * 2}px;height:${r * 2}px;--c:${c[0]};--cd:${c[1]};--d:${(Math.random() * 2.4).toFixed(2)}s`; parent.appendChild(g); }

function extrude(rx, ry){
  const T = 15, N = 10, dx = -Math.sin(ry * Math.PI / 180) * T, dy = Math.sin(rx * Math.PI / 180) * T + 2;
  EXT.forEach(([sel, col, inset]) => { const parts = []; if (inset) parts.push(inset);
    for (let i = 1; i <= N; i++) parts.push(`${(dx * i / N).toFixed(2)}px ${(dy * i / N).toFixed(2)}px 0 ${col}`);
    parts.push(`${(dx * 1.3).toFixed(1)}px ${(dy * 1.3 + 6).toFixed(1)}px 14px rgba(0,0,0,.22)`);
    document.querySelectorAll(sel).forEach((el) => el.style.boxShadow = parts.join(',')); });
}

function tone(freqs, dur = .08, type = 'square', vol = .05, when = 0){ if (muted) return; try { AC = AC || new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { return; }
  const t0 = AC.currentTime + when; freqs.forEach((f) => { const o = AC.createOscillator(), g = AC.createGain(); o.type = type; o.frequency.value = f; g.gain.setValueAtTime(vol, t0); g.gain.exponentialRampToValueAtTime(.0001, t0 + dur); o.connect(g).connect(AC.destination); o.start(t0); o.stop(t0 + dur + .02); }); }

function pixelate(src, w, h, canvas){ const img = new Image(); img.onload = () => { canvas.width = w; canvas.height = h; const c = canvas.getContext('2d'); c.imageSmoothingEnabled = false;
  const r = Math.max(w / img.width, h / img.height), dw = img.width * r, dh = img.height * r; c.drawImage(img, (w - dw) / 2, (h - dh) / 2, dw, dh);
  const d = c.getImageData(0, 0, w, h), p = d.data; for (let i = 0; i < p.length; i += 4) { for (let k = 0; k < 3; k++) p[i + k] = Math.round(p[i + k] / 36) * 36; } c.putImageData(d, 0, 0); }; img.src = src; }

  if (view === 'album') { screen.innerHTML = frame('相册 ' + (picIdx + 1) + '/4', `<div class="album"><canvas id="ph"></canvas></div><div class="cap">◀ ${PIC_CAP[picIdx]} ▶</div>`, '', '返回'); pixelate(A[PICS[picIdx]], 72, 99, $('#ph')); return; }
  if (view === 'works') { screen.innerHTML = frame('作品', `<div class="list">${WORKS.map((w, i) => `<div class="li ${i === sel ? 'sel' : ''}" data-i="${i}">${i + 1}. ${w[0]}</div>`).join('')}</div><div class="detail">${WORKS[sel][1]}</div>`, '', '返回'); screen.querySelectorAll('.li').forEach((c) => c.onclick = () => { sel = +c.dataset.i; tone([1200], .03); render(); }); return; }
  if (view === 'sms') { readSms = true; screen.innerHTML = frame('收件箱', `<div class="pad-in" style="padding-bottom:0;font-size:11px;color:#9FD3FF">来自：Me　2026.11.21</div><div class="bubble" id="bub"></div>`, '', '返回'); const b = $('#bub'); let i = 0; typer = setInterval(() => { b.textContent = SMS.slice(0, ++i); if (i % 2) tone([1800], .015, 'square', .02); if (i >= SMS.length) clearInterval(typer); }, 55); return; }
  if (view === 'contact') { screen.innerHTML = frame('关注我', `<div class="list">${CONTACTS.map((c, i) => `<div class="li ${i === csel ? 'sel' : ''}" data-i="${i}" style="padding:5px 8px">☆ ${c.name}<small>${c.sub}</small></div>`).join('')}</div>`, '扫码', '返回'); screen.querySelectorAll('.li').forEach((c) => c.onclick = () => { csel = +c.dataset.i; showQR(); }); return; }
  if (view === 'qr') { const c = CONTACTS[csel]; screen.innerHTML = frame(c.name, `<div class="qr"><img class="${c.round ? 'round' : ''}" src="${A[c.img]}" alt="${c.name} 二维码"><div class="id">${c.sub}<br>${c.hint}</div></div>`, c.link ? `<a href="${c.link}" target="_blank" rel="noopener">打开主页 ↗</a>` : '', '返回'); return; }
  if (view === 'about') { screen.innerHTML = frame('关于我', `<div class="pad-in" style="font-size:11px;line-height:1.45">我不想只站在台前<br>做那个载体，<br>我想做让载体诠释<br>我的概念的人。<br><br>不迎合所有人，<br>只想让同频的人共鸣。<br><span class="en" style="font-size:15px">TO ME, FROM ME ♥</span></div>`, '', '返回'); return; }
}
function showQR(){ if (!CONTACTS[csel].img) { tone([300], .1); return; } tone([1500], .04); view = 'qr'; render(); }
function open(){ tone([1500], .04); view = MENU[sel].id; if (view === 'works') sel = 0; if (view === 'contact') csel = 0; render(); }
function back(){ tone([900], .04);
  if (view === 'qr') { view = 'contact'; render(); return; }
  if (view === 'menu') view = 'home'; else if (view === 'home') { setClosed(true); return; }
  else { const idx = MENU.findIndex((m) => m.id === view); sel = idx < 0 ? 0 : idx; view = 'menu'; }
  render(); }
function key(k){
  if (view === 'off' || view === 'boot') return;
  if (k.startsWith('n')) { const d = k.slice(1); tone(DTMF[d], .09, 'sine', .06); const n = +d; if (view === 'menu' && n >= 1 && n <= MENU.length) { sel = n - 1; open(); } return; }
  if (k === 'end') { tone([500], .06); view = 'home'; render(); return; }
  if (k === 'rsoft') { if (view === 'home') { sel = 3; open(); } else back(); return; }
  if (view === 'home') { if (k === 'ok' && !readSms) { sel = 3; open(); return; } if (k === 'ok' || k === 'lsoft') { tone([1300], .04); view = 'menu'; sel = 0; render(); } return; }
  if (view === 'menu') { if (k === 'left') sel = (sel + 5) % 6; if (k === 'right') sel = (sel + 1) % 6; if (k === 'up' || k === 'down') sel = (sel + 3) % 6; if (k === 'ok' || k === 'lsoft') { open(); return; } tone([1200], .03); render(); return; }
  if (view === 'album') { if (k === 'left' || k === 'up') picIdx = (picIdx + 3) % 4; if (k === 'right' || k === 'down' || k === 'ok') picIdx = (picIdx + 1) % 4; tone([1200], .03); render(); return; }
  if (view === 'works') { if (k === 'up') sel = (sel + WORKS.length - 1) % WORKS.length; if (k === 'down') sel = (sel + 1) % WORKS.length; tone([1200], .03); render(); return; }
  if (view === 'contact') { if (k === 'up') csel = (csel + CONTACTS.length - 1) % CONTACTS.length; if (k === 'down') csel = (csel + 1) % CONTACTS.length; if (k === 'ok' || k === 'lsoft') { showQR(); return; } tone([1200], .03); render(); return; }
  if (view === 'qr') { if (k === 'up' || k === 'left') { csel = (csel + 1) % 2; } if (k === 'down' || k === 'right') { csel = (csel + 1) % 2; } if (k === 'lsoft' && CONTACTS[csel].link) { const a = screen.querySelector('a'); if (a) a.click(); return; } tone([1200], .03); render(); return; }
}
document.querySelectorAll('[data-key]').forEach((b) => b.addEventListener('click', (e) => { e.stopPropagation(); key(b.dataset.key); }));
function swing(){ charm.classList.remove('swing'); void charm.offsetWidth; charm.classList.add('swing'); }
let snapT = null;
function setClosed(c){ clearTimeout(snapT); phone.classList.toggle('closing', c); phone.classList.toggle('closed', c); $('#toggle').textContent = c ? '翻开手机' : '合上手机';
  if (c) { snapT = setTimeout(() => { phone.classList.add('covered'); const t = $('#tilt'); t.classList.remove('snap'); void t.offsetWidth; t.classList.add('snap'); swing(); tone([180, 90], .05, 'square', .09); tone([2600], .02, 'square', .05, .01); }, 400); }
  else { phone.classList.remove('covered'); swing(); flipSound(true); }
  if (c) { view = 'off'; screen.innerHTML = ''; } else { if (document.activeElement) document.activeElement.blur(); view = 'boot'; render(); setTimeout(jingle, 250); setTimeout(() => { view = 'home'; render(); }, 1700); } }
backEl.addEventListener('click', () => setClosed(false));
backEl.addEventListener('keydown', (e) => { if ((e.key === 'Enter' || e.key === ' ') && phone.classList.contains('closed')) { e.preventDefault(); e.stopPropagation(); setClosed(false); } });
$('#toggle').onclick = () => setClosed(!phone.classList.contains('closed'));
addEventListener('keydown', (e) => { const m = { ArrowUp: 'up', ArrowDown: 'down', ArrowLeft: 'left', ArrowRight: 'right', Enter: 'ok', Escape: 'rsoft', Backspace: 'rsoft' };
  if (phone.classList.contains('closed')) { if (e.key === 'Enter') setClosed(false); return; }
  if (m[e.key]) { e.preventDefault(); key(m[e.key]); } else if (/^[0-9*#]$/.test(e.key)) key('n' + e.key); });
</script>
